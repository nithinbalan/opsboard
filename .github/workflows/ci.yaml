name: OpsBoard - CI and Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Least-privilege default permissions.
permissions:
  contents: read

# Cancel obsolete runs for the same branch or pull request.
concurrency:
  group: opsboard-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # BACKEND: GO QUALITY, TESTS AND BUILD
  # ============================================================
  backend-quality:
    name: Backend - Quality, Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Verify dependency files are tidy
        run: go mod tidy -diff

      - name: Verify Go formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run unit tests with race detection and coverage
        run: go test -race -cover ./...

      - name: Run Go static analysis
        run: go vet ./...

      - name: Build Go application
        run: go build ./...

  # ============================================================
  # FRONTEND: ANGULAR QUALITY, TESTS AND BUILD
  # ============================================================
  frontend-quality:
    name: Frontend - Angular Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test -- --no-watch

  # ============================================================
  # SUPPLY-CHAIN SECURITY: PULL REQUEST DEPENDENCIES
  # ============================================================
  dependency-review:
    name: Security - Pull Request Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4

  # ============================================================
  # SECRET DETECTION
  # ============================================================
  secret-scan:
    name: Security - Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for exposed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # GO VULNERABILITY ANALYSIS
  # ============================================================
  go-vulnerability-scan:
    name: Security - Go Vulnerability Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: backend/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Analyze Go application for known vulnerabilities
        working-directory: backend
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  # ============================================================
  # FRONTEND DEPENDENCY VULNERABILITY AUDIT
  # ============================================================
  frontend-dependency-audit:
    name: Security - Frontend Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Fail on high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

  # ============================================================
  # CONTAINER SECURITY AND SOFTWARE BILL OF MATERIALS
  # ============================================================
  container-security:
    name: Security - Container Scanning and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend API image
        run: docker build -t opsboard-api:ci ./backend

      - name: Build frontend image
        run: docker build -t opsboard-frontend:ci ./frontend

      # Generate SBOMs before the enforcing scans so they can
      # still be uploaded when a vulnerability scan fails.
      - name: Generate backend API CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: opsboard-api:ci
          format: cyclonedx
          output: opsboard-api-sbom.json
          exit-code: '0'

      - name: Generate frontend CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: opsboard-frontend:ci
          format: cyclonedx
          output: opsboard-frontend-sbom.json
          exit-code: '0'

      - name: Scan backend API image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: opsboard-api:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Scan frontend image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: opsboard-frontend:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

      - name: Upload container SBOM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opsboard-container-sboms
          path: |
            opsboard-api-sbom.json
            opsboard-frontend-sbom.json
          if-no-files-found: warn
          retention-days: 30
