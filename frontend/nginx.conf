client_body_temp_path /tmp/client_temp;
proxy_temp_path       /tmp/proxy_temp;
fastcgi_temp_path     /tmp/fastcgi_temp;
uwsgi_temp_path       /tmp/uwsgi_temp;
scgi_temp_path        /tmp/scgi_temp;

server_tokens off;
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Set at server level so they also apply to /api/ and /health/ responses.
    # Do not add other add_header directives inside location blocks: nginx would
    # then stop inheriting these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # index.html and SPA deep links must always be revalidated.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # Build output is content-hashed, so it can be cached for a long time.
    location ~* \.(?:js|css|ico)$ {
        try_files $uri =404;
        expires 1y;
    }

    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    location /health/ {
        proxy_pass http://api:8080/health/;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }
}
